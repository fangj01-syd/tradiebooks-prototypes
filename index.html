<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TradieBooks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #f7f9f7 0%, #eef2ee 100%);
    color: #1a1f1a;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  header {
    background: white;
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  .logo { font-weight: 800; font-size: 21px; color: #1E3A2F; letter-spacing: -0.4px; }
  .logo span { color: #C45C3E; }
  .card {
    background: white;
    margin: 16px;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 4px 16px rgba(30, 58, 47, 0.06);
  }
  .card h2 { font-size: 13px; color: #7a857a; font-weight: 500; margin-bottom: 6px; }
  .card .amount { font-size: 34px; font-weight: 700; color: #1E3A2F; letter-spacing: -0.8px; }
  .card .sub { font-size: 13px; color: #9aa39a; margin-top: 4px; }
  .stats { display: flex; gap: 12px; margin: 0 16px 8px; }
  .stat {
    flex: 1; background: white; border-radius: 16px; padding: 16px 12px; text-align: center;
    box-shadow: 0 2px 8px rgba(30, 58, 47, 0.05);
  }
  .stat .label { font-size: 11px; color: #9aa39a; text-transform: uppercase; letter-spacing: 0.4px; }
  .stat .val { font-size: 20px; font-weight: 700; margin-top: 6px; color: #1E3A2F; }
  .recent { margin: 12px 16px 20px; }
  .recent h3 { font-size: 13px; margin-bottom: 10px; color: #7a857a; font-weight: 500; }
  .recent-item {
    background: white; padding: 14px 16px; border-radius: 14px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; font-size: 14.5px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
  }
  .btn {
    display: block; width: calc(100% - 32px); margin: 10px 16px; padding: 16px;
    background: #1E3A2F; color: white; border: none; border-radius: 28px;
    font-size: 16px; font-weight: 600; text-align: center; text-decoration: none;
    box-shadow: 0 4px 12px rgba(30, 58, 47, 0.2);
    min-height: 48px;
  }
  .btn.secondary { background: #C45C3E; box-shadow: 0 4px 12px rgba(196, 92, 62, 0.25); }
  nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; background: white;
    display: flex; border-top: 1px solid #eee; padding: 6px 0 14px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
  }
  nav a {
    flex: 1; text-align: center; text-decoration: none; color: #9aa39a;
    font-size: 10px; min-height: 52px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  nav a.active { color: #1E3A2F; font-weight: 600; }
  nav a div { font-size: 20px; }
</style>
</head>
<body>
  <header>
    <div class="logo">Tradie<span>Books</span></div>
    <div style="font-size:12px;color:#b0b8b0;">AU · Solo</div>
  </header>

  <div id="overdueAlert" style="display:none; background:#ffebee; color:#c62828; margin:12px 16px; padding:12px 14px; border-radius:12px; font-size:14px;"></div>

  <div class="card">
    <h2>GST this quarter</h2>
    <div class="amount" id="gstAmount">$0</div>
    <div class="sub">to pay</div>
  </div>

  <div class="card">
    <h2>Unpaid invoices</h2>
    <div class="amount" id="unpaidAmount">$0</div>
    <div class="sub" id="unpaidCount">0 invoices</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label">This month</div>
      <div class="val" id="monthIncome">$0</div>
      <div class="label" style="margin-top:2px;">income</div>
    </div>
    <div class="stat">
      <div class="label">This month</div>
      <div class="val" id="monthExpenses">$0</div>
      <div class="label" style="margin-top:2px;">expenses</div>
    </div>
  </div>

  <div class="card" style="margin-top:4px;">
    <h2>Income (last 6 months)</h2>
    <div id="chart" style="display:flex; align-items:flex-end; height:120px; gap:8px; margin-top:16px;"></div>
  </div>

  <div class="recent">
    <h3>Recent</h3>
    <div id="recentList"></div>
  </div>

  <a href="invoice.html" class="btn">+ New Invoice</a>
  <a href="receipt.html" class="btn secondary">+ Add Receipt</a>

  <nav>
    <a href="index.html" class="active"><div>🏠</div>Home</a>
    <a href="invoices.html"><div>📄</div>Invoices</a>
    <a href="receipts.html"><div>🧾</div>Receipts</a>
    <a href="bas.html"><div>📊</div>BAS</a>
    <a href="reports.html"><div>📈</div>Reports</a>
    <a href="settings.html"><div>⚙️</div>More</a>
  </nav>

  <script>
    function load() {
      const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
      const receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
      const unpaid = invoices.filter(i => !i.paid);
      const unpaidTotal = unpaid.reduce((s, i) => s + (i.total || 0), 0);
      const salesGST = invoices.reduce((s, i) => s + (i.gst || 0), 0);
      const purchaseGST = receipts.reduce((s, r) => s + ((r.amount || 0) * 0.1), 0);
      const netGST = Math.max(0, salesGST - purchaseGST);
      document.getElementById('gstAmount').textContent = '$' + Math.round(netGST);
      document.getElementById('unpaidAmount').textContent = '$' + Math.round(unpaidTotal);
      document.getElementById('unpaidCount').textContent = unpaid.length + ' invoice' + (unpaid.length !== 1 ? 's' : '');

      const today = new Date().toISOString().slice(0, 10);
      const overdue = unpaid.filter(i => i.dueDate && i.dueDate < today);
      const alertEl = document.getElementById('overdueAlert');
      if (overdue.length > 0) {
        alertEl.style.display = 'block';
        alertEl.innerHTML = `⚠️ You have <strong>${overdue.length}</strong> overdue invoice${overdue.length > 1 ? 's' : ''}`;
      }

      const month = new Date().toISOString().slice(0, 7);
      const monthIncome = invoices.filter(i => (i.date || '').startsWith(month)).reduce((s, i) => s + (i.total || 0), 0);
      const monthExpenses = receipts.filter(r => (r.date || '').startsWith(month)).reduce((s, r) => s + (r.amount || 0), 0);
      document.getElementById('monthIncome').textContent = '$' + Math.round(monthIncome);
      document.getElementById('monthExpenses').textContent = '$' + Math.round(monthExpenses);

      const chartEl = document.getElementById('chart');
      const months = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date();
        d.setMonth(d.getMonth() - i);
        months.push(d.toISOString().slice(0, 7));
      }
      const maxIncome = Math.max(...months.map(m => invoices.filter(inv => (inv.date||'').startsWith(m)).reduce((s,inv)=>s+(inv.total||0),0)), 1);
      chartEl.innerHTML = months.map((m, i) => {
        const amt = invoices.filter(inv => (inv.date||'').startsWith(m)).reduce((s,inv)=>s+(inv.total||0),0);
        const h = Math.round((amt / maxIncome) * 90) || 8;
        const label = m.slice(5);
        const isCurrent = i === months.length - 1;
        const color = isCurrent ? '#1E3A2F' : '#B8D4C4';
        return `<div style="flex:1; text-align:center;">
          <div style="background:${color}; height:${h}px; border-radius:6px 6px 2px 2px;" title="$${Math.round(amt)}"></div>
          <div style="font-size:12px; color:#666; margin-top:8px; font-weight:${isCurrent?'600':'500'}; letter-spacing:0.3px;">${label}</div>
        </div>`;
      }).join('');

      const recent = [
        ...invoices.slice(0, 4).map(i => ({ type: 'invoice', text: i.customer || 'Invoice', amount: i.total || 0, date: i.date })),
        ...receipts.slice(0, 4).map(r => ({ type: 'receipt', text: r.merchant || 'Receipt', amount: r.amount || 0, date: r.date }))
      ].sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 5);
      const recentList = document.getElementById('recentList');
      recentList.innerHTML = recent.length === 0
        ? '<div style="color:#aaa;font-size:14px;padding:12px 0;">No activity yet</div>'
        : recent.map(r => `<div class="recent-item"><span>${r.type === 'invoice' ? '📄' : '🧾'} ${r.text}</span><span style="font-weight:600;">$${Math.round(r.amount)}</span></div>`).join('');
    }
    load();
  </script>
</body>
</html>
