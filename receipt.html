<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Add Receipt - TradieBooks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f4;
    color: #1c211c;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
  }
  header {
    background: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #eee;
  }
  header a { text-decoration: none; color: #1E3A2F; font-size: 20px; margin-right: 10px; padding: 4px; }
  header h1 { font-size: 17px; font-weight: 600; }
  .camera {
    margin: 16px;
    background: #1a1a1a;
    border-radius: 16px;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 14px;
    text-align: center;
  }
  .form { padding: 0 16px 16px; }
  label { display: block; font-size: 12px; color: #888; margin: 16px 0 6px; font-weight: 500; }
  input {
    width: 100%;
    padding: 14px;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    font-size: 16px;
    background: white;
    outline: none;
  }
  input:focus { border-color: #1E3A2F; }
  .hint { color: #69756b; font-size: 12px; line-height: 1.5; margin-top: 6px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .chip {
    padding: 8px 14px;
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
  }
  .chip.active { background: #1E3A2F; color: white; border-color: #1E3A2F; }
  .btn {
    display: block;
    width: calc(100% - 32px);
    margin: 16px;
    padding: 16px;
    background: #1E3A2F;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
  }
  .btn:active { transform: scale(0.98); }
  .success { display: none; text-align: center; padding: 60px 24px; }
  .success h2 { color: #1E3A2F; margin: 12px 0; }
</style>
</head>
<body>
  <header>
    <a id="backLink" href="index.html">←</a>
    <h1 id="pageTitle">Add Receipt</h1>
  </header>

  <div id="formView">
    <div class="camera">📷<br><span style="font-size:12px;opacity:0.7;">Tap to capture (demo)</span></div>

    <div class="form">
      <label for="amount">Total paid</label>
      <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" inputmode="decimal">

      <label for="gst">GST included in this receipt</label>
      <input type="number" id="gst" placeholder="0.00" min="0" step="0.01" inputmode="decimal">
      <p class="hint" id="gstHint">Enter the GST shown on the receipt, or 0 if there is none. BAS will use this amount.</p>

      <label for="date">Receipt / payment date</label>
      <input type="date" id="date" required>

      <label>Merchant</label>
      <input type="text" id="merchant" placeholder="e.g. Bunnings">

      <label>Category</label>
      <div class="chips" id="chips">
        <div class="chip active" data-cat="Materials">Materials</div>
        <div class="chip" data-cat="Tools">Tools</div>
        <div class="chip" data-cat="Fuel">Fuel</div>
        <div class="chip" data-cat="Other">Other</div>
      </div>
    </div>

    <button class="btn" id="saveButton" onclick="save()">Save Receipt</button>
  </div>

  <div id="successView" class="success">
    <div style="font-size:56px; color:#1E3A2F;">✓</div>
    <h2 id="successTitle">Receipt saved</h2>
    <a href="receipts.html" class="btn" style="display:inline-block; width:auto; padding:14px 36px; margin-top:16px;">View Receipts</a>
  </div>

  <script src="receipt-gst.js"></script>
  <script src="reporting-period.js"></script>
  <script>
    let category = 'Materials';
    const params = new URLSearchParams(location.search);
    const editing = params.has('idx');
    const idx = Number(params.get('idx'));
    const receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
    const existing = editing && Number.isInteger(idx) && idx >= 0 ? receipts[idx] : null;
    document.getElementById('date').value = localDate();

    function selectCategory(value) {
      category = value;
      document.querySelectorAll('.chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.cat === value);
      });
    }

    if (editing) {
      if (!existing) {
        alert('Receipt not found');
        location.href = 'receipts.html';
      } else {
        document.title = 'Edit Receipt - TradieBooks';
        document.getElementById('pageTitle').textContent = 'Edit Receipt';
        document.getElementById('backLink').href = 'receipts.html';
        document.getElementById('saveButton').textContent = 'Save Changes';
        document.getElementById('successTitle').textContent = 'Receipt updated';
        document.getElementById('amount').value = existing.amount;
        document.getElementById('merchant').value = existing.merchant || '';
        document.getElementById('date').value = existing.date || localDate();
        if (hasRecordedReceiptGst(existing)) document.getElementById('gst').value = existing.gst;
        else document.getElementById('gstHint').textContent = 'GST was not recorded. Check the original receipt and enter the actual GST, or 0 if there is none.';
        selectCategory(existing.category || 'Other');
      }
    }

    document.getElementById('chips').addEventListener('click', e => {
      if (e.target.classList.contains('chip')) {
        selectCategory(e.target.dataset.cat);
      }
    });

    function save() {
      const amountText = document.getElementById('amount').value.trim();
      const gstText = document.getElementById('gst').value.trim();
      const amount = Number(amountText);
      const gst = Number(gstText);
      const merchant = document.getElementById('merchant').value.trim();
      const date = document.getElementById('date').value;
      if (!merchant || !amountText || !Number.isFinite(amount) || amount <= 0) {
        alert('Please enter merchant and a positive total paid');
        return;
      }
      if (!gstText || !Number.isFinite(gst) || gst < 0 || gst > amount) {
        alert('Enter the GST shown on the receipt, or 0 if there is none');
        return;
      }
      if (!validDate(date)) { alert('Enter a valid receipt date'); return; }
      if (editing) {
        if (!existing) return;
        Object.assign(existing, { merchant, amount, gst, category, date });
      } else {
        receipts.unshift({
          id: Date.now(), merchant, amount, gst, category,
          date
        });
      }
      localStorage.setItem('receipts', JSON.stringify(receipts));
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    }
  </script>
</body>
</html>
