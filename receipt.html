<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Add Receipt - TradieBooks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f4;
    color: #1c211c;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
  }
  header {
    background: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #eee;
  }
  header a { text-decoration: none; color: #1E3A2F; font-size: 20px; margin-right: 10px; padding: 4px; }
  header h1 { font-size: 17px; font-weight: 600; }
  .camera {
    margin: 16px;
    background: #1a1a1a;
    border-radius: 16px;
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 14px;
    text-align: center;
  }
  .form { padding: 0 16px 16px; }
  label { display: block; font-size: 12px; color: #888; margin: 16px 0 6px; font-weight: 500; }
  input {
    width: 100%;
    padding: 14px;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    font-size: 16px;
    background: white;
    outline: none;
  }
  input:focus { border-color: #1E3A2F; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .chip {
    padding: 8px 14px;
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
  }
  .chip.active { background: #1E3A2F; color: white; border-color: #1E3A2F; }
  .btn {
    display: block;
    width: calc(100% - 32px);
    margin: 16px;
    padding: 16px;
    background: #1E3A2F;
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
  }
  .btn:active { transform: scale(0.98); }
  .success { display: none; text-align: center; padding: 60px 24px; }
  .success h2 { color: #1E3A2F; margin: 12px 0; }
</style>
</head>
<body>
  <header>
    <a href="index.html">←</a>
    <h1>Add Receipt</h1>
  </header>

  <div id="formView">
    <div class="camera">📷<br><span style="font-size:12px;opacity:0.7;">Tap to capture (demo)</span></div>

    <div class="form">
      <label>Amount</label>
      <input type="number" id="amount" placeholder="0.00" inputmode="decimal">

      <label>Merchant</label>
      <input type="text" id="merchant" placeholder="e.g. Bunnings">

      <label>Category</label>
      <div class="chips" id="chips">
        <div class="chip active" data-cat="Materials">Materials</div>
        <div class="chip" data-cat="Tools">Tools</div>
        <div class="chip" data-cat="Fuel">Fuel</div>
        <div class="chip" data-cat="Other">Other</div>
      </div>
    </div>

    <button class="btn" onclick="save()">Save Receipt</button>
  </div>

  <div id="successView" class="success">
    <div style="font-size:56px; color:#1E3A2F;">✓</div>
    <h2>Receipt saved</h2>
    <a href="receipts.html" class="btn" style="display:inline-block; width:auto; padding:14px 36px; margin-top:16px;">View Receipts</a>
  </div>

  <script>
    let category = 'Materials';
    document.getElementById('chips').addEventListener('click', e => {
      if (e.target.classList.contains('chip')) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        e.target.classList.add('active');
        category = e.target.dataset.cat;
      }
    });

    function save() {
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      const merchant = document.getElementById('merchant').value.trim();
      if (!merchant || amount <= 0) { alert('Please enter merchant and amount'); return; }
      const receipts = JSON.parse(localStorage.getItem('receipts') || '[]');
      receipts.unshift({
        id: Date.now(), merchant, amount, category,
        date: new Date().toISOString().slice(0, 10)
      });
      localStorage.setItem('receipts', JSON.stringify(receipts));
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    }
  </script>
</body>
</html>
