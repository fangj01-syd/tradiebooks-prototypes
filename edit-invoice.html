<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Edit Invoice - TradieBooks</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#163028">
<meta name="apple-mobile-web-app-title" content="TradieBooks">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7f5;
    color: #1c211c;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 80px;
  }
  header {
    background: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #eee;
  }
  header a { text-decoration: none; color: #1E3A2F; font-size: 18px; margin-right: 12px; }
  header h1 { font-size: 18px; font-weight: 600; }
  .form { padding: 16px; }
  label { display: block; font-size: 13px; color: #666; margin: 16px 0 6px; }
  input, select {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    background: white;
  }
  .line-item { background: white; border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .line-item input { margin-bottom: 6px; }
  .remove-line { background: none; border: 0; color: #c62828; padding: 8px 0; }
  .add-line { width: 100%; padding: 12px; border: 1px dashed #bbb; border-radius: 12px; background: white; font-size: 15px; }
  .total {
    background: white;
    margin: 16px;
    padding: 20px;
    border-radius: 16px;
    text-align: right;
  }
  .total .label { font-size: 14px; color: #666; }
  .total .amount { font-size: 28px; font-weight: 700; color: #1E3A2F; }
  .btn {
    display: block;
    width: calc(100% - 32px);
    margin: 12px 16px;
    padding: 16px;
    background: #1E3A2F;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
  }
</style>
<script src="supabase-config.js"></script>
<script src="account.js"></script>
</head>
<body>
  <header>
    <a href="invoices.html">←</a>
    <h1>Edit Invoice</h1>
  </header>

  <div class="form">
    <label>Your ABN (optional)</label>
    <input type="text" id="abn" placeholder="e.g. 12 345 678 901">

    <label>Customer</label>
    <input type="text" id="customer">

    <label>Payment terms</label>
    <select id="terms">
      <option value="due">Due on receipt</option>
      <option value="7">Net 7</option>
      <option value="14">Net 14</option>
      <option value="30">Net 30</option>
    </select>

    <label>Line items</label>
    <div id="lineItems"></div>
    <button class="add-line" type="button" onclick="addLine()">+ Add line item</button>

    <label>Notes (optional)</label>
    <input type="text" id="notes">
  </div>

  <div class="total">
    <div class="label">Subtotal</div>
    <div style="font-size:18px; margin:4px 0;">$<span id="subtotal">0.00</span></div>
    <div class="label">GST (10%)</div>
    <div style="font-size:18px; margin:4px 0;">$<span id="gst">0.00</span></div>
    <div class="label" style="margin-top:12px;">Total (incl GST)</div>
    <div class="amount">$<span id="total">0.00</span></div>
  </div>

  <button class="btn" onclick="save()">Save Changes</button>

  <script>
    const params = new URLSearchParams(location.search);
    const idx = Number(params.get('idx'));
    const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
    const inv = Number.isInteger(idx) && idx >= 0 ? invoices[idx] : null;

    function addLine(line = {}) {
      const div = document.createElement('div');
      div.className = 'line-item';
      div.innerHTML = `
        <input type="text" class="desc" placeholder="Description" oninput="calc()">
        <div style="display:flex; gap:8px;">
          <input type="number" class="qty" min="0.01" step="any" inputmode="decimal" placeholder="Qty" oninput="calc()" style="width:80px;">
          <input type="number" class="price" min="0.01" step="any" inputmode="decimal" placeholder="Price" oninput="calc()" style="flex:1;">
        </div>
        <button class="remove-line" type="button" onclick="this.parentElement.remove(); calc();">Remove</button>`;
      div.querySelector('.desc').value = line.desc || '';
      div.querySelector('.qty').value = line.qty ?? 1;
      div.querySelector('.price').value = line.price ?? '';
      document.getElementById('lineItems').appendChild(div);
      calc();
    }

    if (!inv) {
      const missingInvoice = () => { alert('Invoice not found'); location.href = 'invoices.html'; };
      if (TradieCloud.enabled) document.addEventListener('tradiebooks:ready', missingInvoice, { once: true });
      else missingInvoice();
    } else {
      document.getElementById('customer').value = inv.customer || '';
      document.getElementById('abn').value = inv.abn || '';
      document.getElementById('notes').value = inv.notes || '';
      document.getElementById('terms').value = ['due', '7', '14', '30'].includes(inv.terms) ? inv.terms : 'due';
      const lines = Array.isArray(inv.lines) && inv.lines.length
        ? inv.lines : [{ desc: inv.desc || '', qty: 1, price: inv.amount ?? inv.subtotal ?? '' }];
      lines.forEach(addLine);
    }

    function calc() {
      let subtotal = 0;
      document.querySelectorAll('.line-item').forEach(el => {
        const qty = Number(el.querySelector('.qty').value);
        const price = Number(el.querySelector('.price').value);
        if (qty > 0 && price > 0 && Number.isFinite(qty * price)) subtotal += qty * price;
      });
      const gst = subtotal * 0.1;
      const total = subtotal + gst;
      document.getElementById('subtotal').textContent = subtotal.toFixed(2);
      document.getElementById('gst').textContent = gst.toFixed(2);
      document.getElementById('total').textContent = total.toFixed(2);
    }

    async function save() {
      const customer = document.getElementById('customer').value.trim();
      if (!inv || !customer) {
        alert('Please enter a customer');
        return;
      }
      const lines = [];
      for (const el of document.querySelectorAll('.line-item')) {
        const desc = el.querySelector('.desc').value.trim();
        const qty = Number(el.querySelector('.qty').value);
        const price = Number(el.querySelector('.price').value);
        if (!desc || !Number.isFinite(qty) || qty <= 0 || !Number.isFinite(price) || price <= 0 || !Number.isFinite(qty * price)) {
          alert('Complete every line item with a description, positive quantity and price');
          return;
        }
        lines.push({ desc, qty, price, amount: qty * price });
      }
      if (!lines.length) { alert('Please add at least one line item'); return; }
      const subtotal = lines.reduce((sum, line) => sum + line.amount, 0);
      const gst = subtotal * 0.1;
      const terms = document.getElementById('terms').value;
      let dueDate = '';
      if (terms !== 'due') {
        const base = new Date((inv.date || new Date().toISOString().slice(0, 10)) + 'T12:00:00');
        base.setDate(base.getDate() + Number(terms));
        dueDate = `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}-${String(base.getDate()).padStart(2, '0')}`;
      }
      const saved = await TradieCloud.commit(() => {
        Object.assign(inv, {
          customer, lines, subtotal, gst, total: subtotal + gst, terms, dueDate,
          notes: document.getElementById('notes').value.trim(),
          abn: document.getElementById('abn').value.trim()
        });
        delete inv.desc;
        delete inv.amount;
        localStorage.setItem('invoices', JSON.stringify(invoices));
      });
      if (saved) location.href = 'invoices.html';
    }
  </script>
</body>
</html>
