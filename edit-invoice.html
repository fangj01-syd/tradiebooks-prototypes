<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Edit Invoice - TradieBooks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7f5;
    color: #1c211c;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header {
    background: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #eee;
  }
  header a { text-decoration: none; color: #1E3A2F; font-size: 18px; margin-right: 12px; }
  header h1 { font-size: 18px; font-weight: 600; }
  .form { padding: 16px; }
  label { display: block; font-size: 13px; color: #666; margin: 16px 0 6px; }
  input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    background: white;
  }
  .total {
    background: white;
    margin: 16px;
    padding: 20px;
    border-radius: 16px;
    text-align: right;
  }
  .total .label { font-size: 14px; color: #666; }
  .total .amount { font-size: 28px; font-weight: 700; color: #1E3A2F; }
  .btn {
    display: block;
    width: calc(100% - 32px);
    margin: 12px 16px;
    padding: 16px;
    background: #1E3A2F;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <header>
    <a href="invoices.html">←</a>
    <h1>Edit Invoice</h1>
  </header>

  <div class="form">
    <label>Customer</label>
    <input type="text" id="customer">

    <label>Description</label>
    <input type="text" id="desc">

    <label>Amount (ex GST)</label>
    <input type="number" id="amount" oninput="calc()">
  </div>

  <div class="total">
    <div class="label">GST (10%)</div>
    <div style="font-size:18px; margin:4px 0;">$<span id="gst">0.00</span></div>
    <div class="label" style="margin-top:12px;">Total (incl GST)</div>
    <div class="amount">$<span id="total">0.00</span></div>
  </div>

  <button class="btn" onclick="save()">Save Changes</button>

  <script>
    const params = new URLSearchParams(location.search);
    const idx = parseInt(params.get('idx'));
    const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
    const inv = invoices[idx];

    if (!inv) {
      alert('Invoice not found');
      location.href = 'invoices.html';
    } else {
      document.getElementById('customer').value = inv.customer;
      document.getElementById('desc').value = inv.desc;
      document.getElementById('amount').value = inv.amount;
      calc();
    }

    function calc() {
      const amt = parseFloat(document.getElementById('amount').value) || 0;
      const gst = amt * 0.1;
      const total = amt + gst;
      document.getElementById('gst').textContent = gst.toFixed(2);
      document.getElementById('total').textContent = total.toFixed(2);
    }

    function save() {
      const customer = document.getElementById('customer').value.trim();
      const desc = document.getElementById('desc').value.trim();
      const amount = parseFloat(document.getElementById('amount').value) || 0;
      if (!customer || amount <= 0) {
        alert('Please enter customer and amount');
        return;
      }
      const gst = amount * 0.1;
      const total = amount + gst;

      invoices[idx].customer = customer;
      invoices[idx].desc = desc;
      invoices[idx].amount = amount;
      invoices[idx].gst = gst;
      invoices[idx].total = total;
      localStorage.setItem('invoices', JSON.stringify(invoices));
      location.href = 'invoices.html';
    }
  </script>
</body>
</html>
