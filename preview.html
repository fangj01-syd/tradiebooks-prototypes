<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Invoice Preview - TradieBooks</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7f5;
    color: #1c211c;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 16px;
  }
  header {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
  }
  header a { text-decoration: none; color: #1E3A2F; font-size: 18px; margin-right: 12px; }
  .preview {
    background: white;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .preview h1 { font-size: 22px; margin-bottom: 4px; }
  .preview .meta { color: #888; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
  .items { margin-top: 20px; }
  .items h2 { font-size: 14px; margin-bottom: 4px; }
  .items .row { gap: 12px; font-size: 13px; }
  .items .description { flex: 1; overflow-wrap: anywhere; }
  .items .money { white-space: nowrap; text-align: right; }
  .total { font-size: 20px; font-weight: 700; margin-top: 16px; text-align: right; color: #1E3A2F; }
  .btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: #1E3A2F;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
  }
  @media print {
    body { background: white; padding: 0; max-width: none; }
    header, .btn { display: none !important; }
    .preview { box-shadow: none; border-radius: 0; padding: 20px; }
  }
</style>
</head>
<body>
  <header>
    <a href="invoices.html">←</a>
    <h1 style="font-size:18px;">Invoice Preview</h1>
  </header>

  <div class="preview" id="preview">
    <h1>Invoice</h1>
    <div class="meta" id="meta"></div>
    <div class="row"><span>Invoice #</span><strong id="number"></strong></div>
    <div class="row"><span>Customer</span><strong id="customer"></strong></div>
    <div class="row" id="abnRow" style="display:none;"><span>ABN</span><span id="abn"></span></div>
    <div class="items"><h2>Line items</h2><div id="lineItems"></div></div>
    <div class="row" id="dueRow" style="display:none;"><span>Due date</span><span id="dueDate"></span></div>
    <div class="row" id="notesRow" style="display:none;"><span>Notes</span><span id="notes"></span></div>
    <div class="row"><span>Amount (ex GST)</span><span id="amount"></span></div>
    <div class="row"><span>GST (10%)</span><span id="gst"></span></div>
    <div class="total" id="total"></div>
  </div>

  <button class="btn" onclick="downloadPDF()">Download PDF</button>
  <button class="btn" style="background:white; color:#1E3A2F; border:1.5px solid #1E3A2F; margin-top:8px;" onclick="window.print()">Print</button>
  <button class="btn" style="background:white; color:#1E3A2F; border:1.5px solid #1E3A2F; margin-top:8px;" onclick="copyEmail()">Copy email draft</button>

  <script>
    const params = new URLSearchParams(location.search);
    const idx = parseInt(params.get('idx'));
    const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
    const inv = invoices[idx];

    if (!inv) {
      document.getElementById('preview').innerHTML = '<p>Invoice not found</p>';
    } else {
      document.getElementById('meta').textContent = inv.date || '';
      document.getElementById('number').textContent = inv.number || '';
      document.getElementById('customer').textContent = inv.customer;
      const lines = Array.isArray(inv.lines) && inv.lines.length
        ? inv.lines : [{ desc: inv.desc || '', qty: 1, price: inv.amount ?? inv.subtotal ?? 0 }];
      const lineItems = document.getElementById('lineItems');
      lines.forEach(line => {
        const row = document.createElement('div');
        row.className = 'row';
        const description = document.createElement('span');
        description.className = 'description';
        description.textContent = line.desc || '';
        const money = document.createElement('span');
        money.className = 'money';
        money.textContent = `${line.qty || 1} × $${Number(line.price || 0).toFixed(2)} = $${Number(line.amount ?? (line.qty || 1) * (line.price || 0)).toFixed(2)}`;
        row.append(description, money);
        lineItems.appendChild(row);
      });
      if (inv.abn) { document.getElementById('abn').textContent = inv.abn; document.getElementById('abnRow').style.display = 'flex'; }
      if (inv.dueDate) { document.getElementById('dueDate').textContent = inv.dueDate; document.getElementById('dueRow').style.display = 'flex'; }
      if (inv.notes) { document.getElementById('notes').textContent = inv.notes; document.getElementById('notesRow').style.display = 'flex'; }
      document.getElementById('amount').textContent = '$' + Number(inv.subtotal ?? inv.amount ?? 0).toFixed(2);
      document.getElementById('gst').textContent = '$' + (inv.gst || 0).toFixed(2);
      document.getElementById('total').textContent = 'Total: $' + (inv.total || 0).toFixed(2);
    }

    function downloadPDF() {
      const element = document.getElementById('preview');
      const opt = {
        margin: 10,
        filename: (inv && inv.number ? inv.number : 'invoice') + '.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      html2pdf().set(opt).from(element).save();
    }

    function copyEmail() {
      if (!inv) return;
      const subject = `Invoice ${inv.number || ''} from TradieBooks`;
      const body = `Hi ${inv.customer || ''},

Please find your invoice details below:

Invoice: ${inv.number || ''}
Date: ${inv.date || ''}
Line items:
${(Array.isArray(inv.lines) && inv.lines.length ? inv.lines : [{ desc: inv.desc || '', qty: 1, price: inv.amount || 0 }]).map(line => `- ${line.desc || ''}: ${line.qty || 1} × $${Number(line.price || 0).toFixed(2)}`).join('\n')}
Amount: $${(inv.total || 0).toFixed(2)} (incl GST)
${inv.dueDate ? 'Due date: ' + inv.dueDate + '\n' : ''}${inv.notes ? 'Notes: ' + inv.notes + '\n' : ''}
Thank you.

---
Sent via TradieBooks`;

      const text = `Subject: ${subject}\n\n${body}`;
      navigator.clipboard.writeText(text).then(() => {
        alert('Email draft copied. You can paste it into your email app.');
      }).catch(() => {
        alert(text);
      });
    }
  </script>
</body>
</html>
