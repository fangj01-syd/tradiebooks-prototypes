<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Invoices - TradieBooks</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.webmanifest?v=2">
<meta name="theme-color" content="#163028">
<meta name="apple-mobile-web-app-title" content="TradieBooks">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f4;
    color: #1c211c;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 76px;
  }
  header {
    background: white;
    padding: 14px 20px;
    font-size: 18px;
    font-weight: 700;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header a { font-size: 14px; color: #1E3A2F; text-decoration: none; font-weight: 600; }
  .search {
    margin: 12px 16px;
    padding: 12px 14px;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    font-size: 16px;
    width: calc(100% - 32px);
    background: white;
    outline: none;
  }
  .search:focus { border-color: #1E3A2F; }
  .item {
    background: white;
    margin: 10px 16px;
    padding: 16px;
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .actions { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button, .actions a {
    flex: 1;
    min-width: 60px;
    padding: 9px 4px;
    border: 1px solid #e8e8e8;
    background: white;
    border-radius: 8px;
    font-size: 12px;
    text-align: center;
    text-decoration: none;
    color: #444;
  }
  .actions button.paid { background: #1E3A2F; color: white; border-color: #1E3A2F; }
  .status { font-size: 11px; padding: 3px 8px; border-radius: 10px; font-weight: 500; }
  .paid { background: #e6f4ea; color: #1E3A2F; }
  .unpaid { background: #fff3e0; color: #e65100; }
  .empty { text-align: center; padding: 50px 20px; color: #aaa; font-size: 15px; }
  dialog { width:calc(100% - 32px); max-width:398px; border:0; border-radius:16px; padding:20px; margin:auto; color:#1c211c; }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog h2 { font-size:18px; margin-bottom:8px; }
  dialog p { font-size:13px; color:#667368; line-height:1.5; margin-bottom:14px; }
  dialog label { display:block; font-size:13px; margin-bottom:6px; }
  dialog input { width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; font-size:16px; }
  .dialog-actions { display:flex; gap:10px; margin-top:16px; }
  .dialog-actions button { flex:1; padding:12px; border-radius:10px; border:1px solid #1E3A2F; background:white; color:#1E3A2F; font-size:15px; }
  .dialog-actions button:last-child { background:#1E3A2F; color:white; }
  nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; background: white;
    display: flex; border-top: 1px solid #eee; padding: 6px 0 10px;
  }
  nav a { flex: 1; text-align: center; text-decoration: none; color: #aaa; font-size: 10px; }
  nav a.active { color: #1E3A2F; font-weight: 600; }
  nav a div { font-size: 22px; }
</style>
<script src="supabase-config.js"></script>
<script src="account.js"></script>
</head>
<body>
  <header>Invoices <a href="invoice.html">+ New</a></header>
  <input type="text" class="search" id="search" placeholder="Search..." oninput="render()">
  <div style="display:flex; gap:8px; margin:0 16px 8px; font-size:13px;">
    <button onclick="setFilter('all')" id="fAll" style="padding:6px 12px; border-radius:16px; border:1px solid #ddd; background:#1E3A2F; color:white;">All</button>
    <button onclick="setFilter('unpaid')" id="fUnpaid" style="padding:6px 12px; border-radius:16px; border:1px solid #ddd; background:white;">Unpaid</button>
    <button onclick="setFilter('paid')" id="fPaid" style="padding:6px 12px; border-radius:16px; border:1px solid #ddd; background:white;">Paid</button>
  </div>
  <div id="list"></div>
  <dialog id="paymentDialog">
    <h2 id="paymentTitle">Record payment</h2>
    <p>Use the date you received the full payment. Cash-basis GST estimates use this date.</p>
    <label for="paymentDate">Payment date</label>
    <input type="date" id="paymentDate" required>
    <div class="dialog-actions"><button type="button" onclick="paymentDialog.close()">Cancel</button><button type="button" onclick="savePayment()">Save payment</button></div>
  </dialog>
  <nav>
    <a href="index.html"><div>🏠</div>Home</a>
    <a href="invoices.html" class="active"><div>📄</div>Invoices</a>
    <a href="receipts.html"><div>🧾</div>Receipts</a>
    <a href="bas.html"><div>📊</div>BAS</a>
    <a href="settings.html"><div>⚙️</div>More</a>
  </nav>

  <button onclick="exportBackup()" style="position:fixed; bottom:76px; right:16px; background:#163028; color:white; border:none; border-radius:20px; padding:8px 14px; font-size:12px; z-index:10;">Export</button>
  <script>
    function exportBackup() {
      const data = {
        invoices: JSON.parse(localStorage.getItem('invoices') || '[]'),
        receipts: JSON.parse(localStorage.getItem('receipts') || '[]'),
        lastInvoiceNumber: Number(localStorage.getItem('lastInvoiceNumber')) || 1000,
        exported: new Date().toISOString(),
        gstBasis: localStorage.getItem('gstBasis') === 'cash' ? 'cash' : 'noncash'
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'tradiebooks-backup.json';
      a.click();
    }
  </script>

  <script src="invoice-utils.js"></script>
  <script src="reporting-period.js"></script>
  <script src="html-utils.js"></script>
  <script>
    let currentFilter = 'all';
    let paymentIndex = -1;
    const paymentDialog = document.getElementById('paymentDialog');
    function setFilter(f) {
      currentFilter = f;
      document.getElementById('fAll').style.background = f === 'all' ? '#1E3A2F' : 'white';
      document.getElementById('fAll').style.color = f === 'all' ? 'white' : '#1c211c';
      document.getElementById('fUnpaid').style.background = f === 'unpaid' ? '#1E3A2F' : 'white';
      document.getElementById('fUnpaid').style.color = f === 'unpaid' ? 'white' : '#1c211c';
      document.getElementById('fPaid').style.background = f === 'paid' ? '#1E3A2F' : 'white';
      document.getElementById('fPaid').style.color = f === 'paid' ? 'white' : '#1c211c';
      render();
    }

    function render() {
      const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
      const q = (document.getElementById('search').value || '').toLowerCase();
      const today = localDate();
      const filtered = invoices.filter(inv => {
        const lineText = (inv.lines || []).map(l => l.desc || '').join(' ');
        const matchSearch = (inv.customer || '').toLowerCase().includes(q) || (inv.desc || '').toLowerCase().includes(q) || lineText.toLowerCase().includes(q);
        const matchFilter = currentFilter === 'all' || (currentFilter === 'paid' && inv.paid) || (currentFilter === 'unpaid' && !inv.paid);
        return matchSearch && matchFilter;
      });
      const list = document.getElementById('list');
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">' + (invoices.length === 0 ? 'No invoices yet<br><small>Tap + New to create one</small>' : 'No matches') + '</div>';
        return;
      }
      list.innerHTML = '';
      filtered.forEach(inv => {
        const idx = invoices.indexOf(inv);
        const isOverdue = inv.dueDate && inv.dueDate < today && !inv.paid;
        const itemSummary = inv.lines ? inv.lines.length + ' item' + (inv.lines.length > 1 ? 's' : '') : (inv.desc || '');
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div class="top">
            <div>
              <strong>${escapeHtml(inv.number || '')} · ${escapeHtml(inv.customer || '')}</strong><br>
              <small style="color:#888;">${escapeHtml(itemSummary)} · $${Number(inv.total || 0).toFixed(2)}</small>
              ${inv.dueDate ? `<br><small style="color:${isOverdue ? '#e65100' : '#888'};">Due ${escapeHtml(inv.dueDate)}${isOverdue ? ' · Overdue' : ''}</small>` : ''}
              ${inv.paid ? `<br><small style="color:${inv.paidDate ? '#888' : '#a44b2f'};">${inv.paidDate ? 'Paid ' + escapeHtml(inv.paidDate) : 'Payment date needed'}</small>` : ''}
            </div>
            <span class="status ${inv.paid ? 'paid' : 'unpaid'}">${inv.paid ? 'Paid' : 'Unpaid'}</span>
          </div>
          <div class="actions">
            <a href="preview.html?idx=${idx}">Preview</a>
            <a href="edit-invoice.html?idx=${idx}">Edit</a>
            <button onclick="duplicateInv(${idx})">Copy</button>
            <button onclick="${inv.paid ? 'markUnpaid' : 'openPayment'}(${idx})" class="${inv.paid ? 'paid' : ''}">${inv.paid ? 'Mark unpaid' : 'Record paid'}</button>
            ${inv.paid ? `<button onclick="openPayment(${idx})">Payment date</button>` : ''}
            <button onclick="deleteInv(${idx})">Delete</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    async function duplicateInv(idx) {
      const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
      const original = invoices[idx];
      if (!original) return;
      const saved = await TradieCloud.commit(() => {
        const copy = { ...original };
        copy.id = Date.now();
        copy.number = nextInvoiceNumber(invoices);
        copy.paid = false;
        copy.date = localDate();
        delete copy.paidDate;
        invoices.unshift(copy);
        localStorage.setItem('invoices', JSON.stringify(invoices));
      });
      if (saved) render();
    }

    function openPayment(idx) {
      const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
      const invoice = invoices[idx];
      if (!invoice) return;
      paymentIndex = idx;
      document.getElementById('paymentTitle').textContent = invoice.paid ? 'Edit payment date' : 'Record payment';
      document.getElementById('paymentDate').value = validDate(invoice.paidDate) ? invoice.paidDate : localDate();
      paymentDialog.showModal();
    }
    async function savePayment() {
      const date = document.getElementById('paymentDate').value;
      if (!validDate(date)) { alert('Enter a valid payment date'); return; }
      const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
      if (!invoices[paymentIndex]) { paymentDialog.close(); return; }
      const saved = await TradieCloud.commit(() => {
        invoices[paymentIndex].paid = true;
        invoices[paymentIndex].paidDate = date;
        localStorage.setItem('invoices', JSON.stringify(invoices));
      });
      if (!saved) return;
      paymentDialog.close();
      paymentIndex = -1;
      render();
    }
    async function markUnpaid(idx) {
      const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
      if (!invoices[idx]) return;
      const saved = await TradieCloud.commit(() => {
        invoices[idx].paid = false;
        delete invoices[idx].paidDate;
        localStorage.setItem('invoices', JSON.stringify(invoices));
      });
      if (saved) render();
    }
    async function deleteInv(idx) {
      if (!confirm('Delete this invoice?')) return;
      const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
      const saved = await TradieCloud.commit(() => {
        invoices.splice(idx, 1);
        localStorage.setItem('invoices', JSON.stringify(invoices));
      });
      if (saved) render();
    }
    render();
  </script>
</body>
</html>
