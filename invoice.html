<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>New Invoice - TradieBooks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #f7f9f7 0%, #eef2ee 100%);
    color: #1a1f1a;
    max-width: 430px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 70px;
  }
  header {
    background: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    box-shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  header a { text-decoration: none; color: #163028; font-size: 22px; margin-right: 8px; padding: 4px 8px; }
  header h1 { font-size: 17px; font-weight: 600; }
  .form { padding: 8px 16px; }
  label { display: block; font-size: 12px; color: #7a857a; margin: 16px 0 6px; font-weight: 500; }
  input, select {
    width: 100%;
    padding: 14px;
    border: 1.5px solid #e5e8e5;
    border-radius: 12px;
    font-size: 16px;
    background: white;
    outline: none;
  }
  input:focus, select:focus { border-color: #163028; }
  .line-item {
    background: white;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
    border: 1px solid #eee;
  }
  .line-item input { margin-bottom: 6px; }
  .remove-line { color: #c62828; font-size: 13px; background: none; border: none; padding: 4px 0; }
  .add-line { background: none; border: 1.5px dashed #ccc; width: 100%; padding: 12px; border-radius: 12px; color: #666; margin: 8px 0; }
  .total {
    background: white;
    margin: 12px 16px;
    padding: 16px 18px;
    border-radius: 16px;
    text-align: right;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .total .amount { font-size: 26px; font-weight: 700; color: #163028; }
  .btn {
    display: block;
    width: calc(100% - 32px);
    margin: 12px 16px;
    padding: 16px;
    background: #163028;
    color: white;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 600;
  }
  .success { display: none; text-align: center; padding: 70px 24px; }
</style>
<script src="supabase-config.js"></script>
<script src="account.js"></script>
</head>
<body>
  <header>
    <a href="index.html">←</a>
    <h1>New Invoice</h1>
  </header>

  <div id="formView">
    <div class="form">
      <label>Your ABN (optional)</label>
      <input type="text" id="abn" placeholder="e.g. 12 345 678 901">

      <label>Customer</label>
      <select id="customerSelect" onchange="onCustomerChange()">
        <option value="">Select existing or type new</option>
      </select>
      <input type="text" id="customer" placeholder="Customer name" style="margin-top:8px;">

      <label>Payment terms</label>
      <select id="terms">
        <option value="due">Due on receipt</option>
        <option value="7">Net 7</option>
        <option value="14">Net 14</option>
        <option value="30">Net 30</option>
      </select>

      <label>Line items</label>
      <div id="lineItems"></div>
      <button class="add-line" onclick="addLine()">+ Add line item</button>

      <label>Notes (optional)</label>
      <input type="text" id="notes" placeholder="e.g. Thank you for your business">
    </div>

    <div class="total">
      <div style="font-size:13px; color:#888;">Subtotal</div>
      <div style="font-size:16px;">$<span id="subtotal">0.00</span></div>
      <div style="font-size:13px; color:#888; margin-top:8px;">GST (10%)</div>
      <div style="font-size:16px;">$<span id="gst">0.00</span></div>
      <div style="font-size:13px; color:#888; margin-top:10px;">Total</div>
      <div class="amount">$<span id="total">0.00</span></div>
    </div>

    <button class="btn" onclick="save()">Save Invoice</button>
  </div>

  <div id="successView" class="success">
    <div style="font-size:56px; color:#163028;">✓</div>
    <h2 style="margin:12px 0;">Invoice saved</h2>
    <a href="invoices.html" class="btn" style="display:inline-block; width:auto; padding:14px 36px;">View Invoices</a>
  </div>

  <nav style="position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:white; display:flex; border-top:1px solid #eee; padding:6px 0 10px; z-index:100;">
    <a href="index.html" style="flex:1; text-align:center; text-decoration:none; color:#aaa; font-size:10px;"><div style="font-size:22px;">🏠</div>Home</a>
    <a href="invoices.html" style="flex:1; text-align:center; text-decoration:none; color:#aaa; font-size:10px;"><div style="font-size:22px;">📄</div>Invoices</a>
    <a href="receipts.html" style="flex:1; text-align:center; text-decoration:none; color:#aaa; font-size:10px;"><div style="font-size:22px;">🧾</div>Receipts</a>
    <a href="bas.html" style="flex:1; text-align:center; text-decoration:none; color:#aaa; font-size:10px;"><div style="font-size:22px;">📊</div>BAS</a>
    <a href="settings.html" style="flex:1; text-align:center; text-decoration:none; color:#aaa; font-size:10px;"><div style="font-size:22px;">⚙️</div>More</a>
  </nav>

  <script src="invoice-utils.js"></script>
  <script src="reporting-period.js"></script>
  <script>
    let lineCount = 0;

    function addLine() {
      lineCount++;
      const div = document.createElement('div');
      div.className = 'line-item';
      div.id = 'line-' + lineCount;
      div.innerHTML = `
        <input type="text" placeholder="Description" class="desc" oninput="calc()">
        <div style="display:flex; gap:8px;">
          <input type="number" placeholder="Qty" class="qty" value="1" min="0.01" step="any" inputmode="decimal" oninput="calc()" style="width:70px;">
          <input type="number" placeholder="Price" class="price" min="0.01" step="any" inputmode="decimal" oninput="calc()" style="flex:1;">
        </div>
        <button class="remove-line" onclick="this.parentElement.remove(); calc();">Remove</button>
      `;
      document.getElementById('lineItems').appendChild(div);
    }

    function calc() {
      let subtotal = 0;
      document.querySelectorAll('.line-item').forEach(el => {
        const qty = Number(el.querySelector('.qty').value);
        const price = Number(el.querySelector('.price').value);
        if (qty > 0 && price > 0 && Number.isFinite(qty * price)) subtotal += qty * price;
      });
      const gst = subtotal * 0.1;
      const total = subtotal + gst;
      document.getElementById('subtotal').textContent = subtotal.toFixed(2);
      document.getElementById('gst').textContent = gst.toFixed(2);
      document.getElementById('total').textContent = total.toFixed(2);
    }

    function onCustomerChange() {
      const val = document.getElementById('customerSelect').value;
      if (val) document.getElementById('customer').value = val;
    }

    async function save() {
      const customer = document.getElementById('customer').value.trim();
      if (!customer) { alert('Please enter customer'); return; }

      const lines = [];
      for (const el of document.querySelectorAll('.line-item')) {
        const desc = el.querySelector('.desc').value.trim();
        const qty = Number(el.querySelector('.qty').value);
        const price = Number(el.querySelector('.price').value);
        if (!desc || !Number.isFinite(qty) || qty <= 0 || !Number.isFinite(price) || price <= 0 || !Number.isFinite(qty * price)) {
          alert('Complete every line item with a description, positive quantity and price');
          return;
        }
        lines.push({ desc, qty, price, amount: qty * price });
      }
      if (lines.length === 0) { alert('Please add at least one line item'); return; }

      const subtotal = lines.reduce((s, l) => s + l.amount, 0);
      const gst = subtotal * 0.1;
      const total = subtotal + gst;

      const terms = document.getElementById('terms').value;
      let dueDate = '';
      if (terms !== 'due') {
        const d = new Date();
        d.setDate(d.getDate() + parseInt(terms));
        dueDate = localDate(d);
      }

      const saved = await TradieCloud.commit(() => {
        const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
        const invNum = nextInvoiceNumber(invoices);
        invoices.unshift({
          id: Date.now(), number: invNum, customer, lines, subtotal, gst, total,
          terms, dueDate, notes: document.getElementById('notes').value.trim(),
          abn: document.getElementById('abn').value.trim(), paid: false, date: localDate()
        });
        localStorage.setItem('invoices', JSON.stringify(invoices));
      });
      if (!saved) return;
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
    }

    const invoices = JSON.parse(localStorage.getItem('invoices') || '[]');
    const customers = [...new Set(invoices.map(i => i.customer).filter(Boolean))];
    const select = document.getElementById('customerSelect');
    customers.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      select.appendChild(opt);
    });

    addLine();
  </script>
</body>
</html>
